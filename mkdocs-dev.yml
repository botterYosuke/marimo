site_name: marimo Developer Docs
site_description: Internal developer documentation for marimo
docs_dir: development_docs
site_dir: development_docs_site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal

nav:
  - Home: index.md
  - Backend & MCP:
      - Adding Backend and MCP Tools: adding_backend_and_mcp_tools.md
  - Configuration:
      - Adding Lint Rules: adding_lint_rules.md
      - OpenAPI: openapi.md
  - Development:
      - Testing: testing.md
      - Prompts: prompts.md
      - Traces: traces.md
  - Pyodide:
      - Pyodide: pyodide.md
      - Custom Wheel: pyodide-custom-wheel.md
  - Fixes & Improvements:
      - Chart Widget Caching: chart-widget-caching-fix.md
      - UI Switch State: ui-switch-state-fix.md
      - AnyWidget Backend Sync: anywidget-backend-sync.md
      - AnyWidget Performance: anywidget-performance.md
      - Frontend Freeze: frontend-freeze-fix.md
      - Grid Layout Auto Placement: grid-layout-auto-placement.md
  - Features:
      - Broadcast Channel HUD: broadcast-channel-hud.md
      - Chart Theme: chart-theme.md
      - Skill Tree Panel: skill-tree-panel.md
  - Deployment:
      - Electron Startup: electron-startup-config.md
      - Steam Deploy: steam-deploy.md
      - Steam Integration Fixes: steam-integration-fixes.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
