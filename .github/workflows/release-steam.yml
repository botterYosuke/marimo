name: Release Steam App

on:
  push:
    branches:
      - game
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel if another build is in progress

permissions:
  contents: write  # Required for creating releases
  id-token: write  # Required for OIDC

env:
  TURBO_TEAM: marimo

jobs:
  # Build Tauri app for Windows, macOS, and Linux
  build_windows:
    name: 🪟 Build Windows
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⎔ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: 📥 Install Node.js dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 📦 Build frontend
        shell: bash
        run: make fe
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: 🔨 Get version
        id: get_version
        shell: pwsh
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          echo "marimo_version=$version" >> $env:GITHUB_OUTPUT
          echo "MARIMO_VERSION=$version" >> $env:GITHUB_ENV

      - name: 📦 Download uv binary for bundling
        run: node scripts/download-uv.js

      - name: 🔧 Prepare Tauri resources
        run: |
          cd src-tauri
          node prepare-resources.js

      - name: 📦 Verify uv binary (Windows)
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/binaries/uv.exe") {
            Write-Host "✅ uv binary downloaded successfully"
          } else {
            Write-Host "❌ uv binary not found"
            exit 1
          }

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🦀 Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 🔨 Build Tauri app (Steam)
        run: cargo tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload Windows artifacts (Steam)
        uses: actions/upload-artifact@v4
        with:
          name: steam-windows-${{ env.MARIMO_VERSION }}
          path: src-tauri/target/release/bundle/nsis/
          retention-days: 7

  build_macos:
    name: 🍎 Build macOS
    runs-on: macos-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⎔ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: 📥 Install Node.js dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 📦 Build frontend
        run: make fe
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: 🔨 Get version
        id: get_version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "marimo_version=$version" >> $GITHUB_OUTPUT
          echo "MARIMO_VERSION=$version" >> $GITHUB_ENV

      - name: 📦 Download uv binary for bundling
        run: node scripts/download-uv.js

      - name: 🔧 Prepare Tauri resources
        run: |
          cd src-tauri
          node prepare-resources.js

      - name: 📦 Verify uv binary (Unix)
        run: |
          if [ -f "src-tauri/binaries/uv" ]; then
            echo "✅ uv binary downloaded successfully"
            file src-tauri/binaries/uv
          else
            echo "❌ uv binary not found"
            exit 1
          fi

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🦀 Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 🔨 Build Tauri app (Steam)
        run: cargo tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload macOS artifacts (Steam)
        uses: actions/upload-artifact@v4
        with:
          name: steam-macos-${{ env.MARIMO_VERSION }}
          path: src-tauri/target/release/bundle/macos/
          retention-days: 7

  build_linux:
    name: 🐧 Build Linux
    runs-on: ubuntu-24.04

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐧 Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: ⎔ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: 📥 Install Node.js dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 📦 Build frontend
        run: make fe
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: 🔨 Get version
        id: get_version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "marimo_version=$version" >> $GITHUB_OUTPUT
          echo "MARIMO_VERSION=$version" >> $GITHUB_ENV

      - name: 📦 Download uv binary for bundling
        run: node scripts/download-uv.js

      - name: 🔧 Prepare Tauri resources
        run: |
          cd src-tauri
          node prepare-resources.js

      - name: 📦 Verify uv binary (Unix)
        run: |
          if [ -f "src-tauri/binaries/uv" ]; then
            echo "✅ uv binary downloaded successfully"
            file src-tauri/binaries/uv
          else
            echo "❌ uv binary not found"
            exit 1
          fi

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🦀 Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 🔨 Build Tauri app (Steam)
        run: cargo tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload Linux artifacts (Steam)
        uses: actions/upload-artifact@v4
        with:
          name: steam-linux-${{ env.MARIMO_VERSION }}
          path: src-tauri/target/release/bundle/appimage/
          retention-days: 7

  # Deploy to Steam
  deploy_steam:
    name: 🚂 Deploy to Steam
    needs: [build_windows, build_macos, build_linux]
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: 🔨 Get version
        id: get_version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "marimo_version=$version" >> $GITHUB_OUTPUT

      - name: 📥 Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: steam-windows-${{ steps.get_version.outputs.marimo_version }}
          path: dist-tauri/win/

      - name: 📥 Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: steam-macos-${{ steps.get_version.outputs.marimo_version }}
          path: dist-tauri/mac/

      - name: 📥 Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: steam-linux-${{ steps.get_version.outputs.marimo_version }}
          path: dist-tauri/linux/

      - name: 📁 Create Steam VDF directory
        run: mkdir -p steam/vdf

      - name: 🚂 Deploy to Steam
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 4228740
          buildDescription: "v${{ steps.get_version.outputs.marimo_version }}"
          rootPath: steam/vdf
          depot1Path: ../../dist-tauri/win
          depot2Path: ../../dist-tauri/mac
          depot3Path: ../../dist-tauri/linux
