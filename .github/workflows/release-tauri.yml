name: Release Tauri App

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  TURBO_TEAM: marimo

jobs:
  build_windows:
    name: 🪟 Build Windows
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⎔ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: 📥 Install Node.js dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 📦 Build frontend
        uses: ./.github/actions/build-frontend
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: ⬇️ Download uv binary for bundling
        run: node scripts/download-uv.js

      - name: ✅ Verify uv binary
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/binaries/uv.exe") {
            Write-Host "uv binary downloaded successfully"
          } else {
            Write-Host "uv binary not found"
            exit 1
          }

      - name: Install uv (for version detection)
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: 🔨 Get version
        id: get_version
        shell: pwsh
        run: |
          $version = uv version --short
          echo "marimo_version=$version" >> $env:GITHUB_OUTPUT
          echo "MARIMO_VERSION=$version" >> $env:GITHUB_ENV

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 🔧 Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: 📦 Build Tauri app
        working-directory: src-tauri
        run: cargo tauri build

      - name: 📤 Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-${{ env.MARIMO_VERSION }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  build_macos:
    name: 🍎 Build macOS
    runs-on: macos-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⎔ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: 📥 Install Node.js dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 📦 Build frontend
        uses: ./.github/actions/build-frontend
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: ⬇️ Download uv binary for bundling
        run: node scripts/download-uv.js

      - name: ✅ Verify uv binary
        run: |
          if [ -f "src-tauri/binaries/uv" ]; then
            echo "uv binary downloaded successfully"
            file src-tauri/binaries/uv
          else
            echo "uv binary not found"
            exit 1
          fi

      - name: Install uv (for version detection)
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: 🔨 Get version
        id: get_version
        run: |
          version=$(uv version --short)
          echo "marimo_version=$version" >> $GITHUB_OUTPUT
          echo "MARIMO_VERSION=$version" >> $GITHUB_ENV

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 🔧 Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: 📦 Build Tauri app
        working-directory: src-tauri
        run: cargo tauri build

      - name: 📤 Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-${{ env.MARIMO_VERSION }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

  build_linux:
    name: 🐧 Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: ⎔ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: 📥 Install Node.js dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 📦 Build frontend
        uses: ./.github/actions/build-frontend
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: ⬇️ Download uv binary for bundling
        run: node scripts/download-uv.js

      - name: ✅ Verify uv binary
        run: |
          if [ -f "src-tauri/binaries/uv" ]; then
            echo "uv binary downloaded successfully"
            file src-tauri/binaries/uv
          else
            echo "uv binary not found"
            exit 1
          fi

      - name: Install uv (for version detection)
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: 🔨 Get version
        id: get_version
        run: |
          version=$(uv version --short)
          echo "marimo_version=$version" >> $GITHUB_OUTPUT
          echo "MARIMO_VERSION=$version" >> $GITHUB_ENV

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 🔧 Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: 📦 Build Tauri app
        working-directory: src-tauri
        run: cargo tauri build

      - name: 📤 Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-${{ env.MARIMO_VERSION }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

  create_release:
    name: 📦 Create Release
    needs: [build_windows, build_macos, build_linux]
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: 🔨 Get version
        id: get_version
        run: |
          version=$(uv version --short)
          echo "marimo_version=$version" >> $GITHUB_OUTPUT
          echo "tag=v$version-tauri" >> $GITHUB_OUTPUT

      - name: 🔍 Check if release already exists
        id: check_release
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.get_version.outputs.tag }}")

          if [ "$response" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Release ${{ steps.get_version.outputs.tag }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Release ${{ steps.get_version.outputs.tag }} does not exist"
          fi

      - name: 📥 Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-windows-${{ steps.get_version.outputs.marimo_version }}
          path: artifacts/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-macos-${{ steps.get_version.outputs.marimo_version }}
          path: artifacts/macos
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-linux-${{ steps.get_version.outputs.marimo_version }}
          path: artifacts/linux
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "marimo Desktop App ${{ steps.get_version.outputs.marimo_version }}"
          body: |
            ## Tauri Desktop App Release ${{ steps.get_version.outputs.marimo_version }}

            This release contains the Tauri-based desktop application for marimo.

            ### Downloads

            #### Windows
            - **NSIS Installer**: `.exe`

            #### macOS (Apple Silicon)
            - **DMG**: `.dmg`

            #### Linux
            - **AppImage**: `.AppImage`
            - **Debian**: `.deb`

            ### Installation

            - **Windows**: Run the NSIS installer
            - **macOS**: Open the DMG file and drag marimo to Applications
            - **Linux**: Make the AppImage executable (`chmod +x`) and run it, or install the .deb package

            ### Note
            On first launch, the app will automatically set up a Python environment using the bundled uv tool. This may take a minute on the first run.

          files: |
            artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚠️ Skip release (already exists)
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "Release ${{ steps.get_version.outputs.tag }} already exists. Skipping release creation."
          exit 0

      - name: 📧 Post to Discord
        if: steps.check_release.outputs.exists == 'false'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.get_version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.get_version.outputs.marimo_version }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"username\": \"GitHub\", \"avatar_url\": \"https://cdn.discordapp.com/icons/1059888774789730424/bc13378b871c363137358a531e1a2f82.png\", \"embeds\": [{\"title\": \"marimo Desktop App ${RELEASE_VERSION}\", \"url\": \"https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}\", \"color\": 2105893, \"description\": \"New Tauri desktop release is available!\n\n**Downloads:**\n- Windows: NSIS installer (.exe)\n- macOS: DMG (Apple Silicon)\n- Linux: AppImage / .deb\"}]}" \
            "$DISCORD_WEBHOOK_URL"
