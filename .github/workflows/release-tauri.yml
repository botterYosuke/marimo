name: Release Tauri App

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  TURBO_TEAM: marimo

jobs:
  check-release:
    name: Check Release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      marimo_version: ${{ steps.version.outputs.marimo_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Get version
        id: version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "marimo_version=$version" >> $GITHUB_OUTPUT
          echo "tag=v$version-tauri" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.tag }}")
          if [ "$response" = "200" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.tag }} already exists, skipping"
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos-arm
            os: macos-latest
          - platform: macos-intel
            os: macos-13
          - platform: linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build frontend
        uses: ./.github/actions/build-frontend
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: Download uv binary for bundling
        run: node scripts/download-uv.js

      - name: Prepare Tauri resources
        run: |
          cd src-tauri
          node prepare-resources.js

      - name: Verify uv binary (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ -f "src-tauri/binaries/uv" ]; then
            echo "uv binary downloaded successfully"
            file src-tauri/binaries/uv
          else
            echo "uv binary not found"
            exit 1
          fi

      - name: Verify uv binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/binaries/uv.exe") {
            Write-Host "uv binary downloaded successfully"
          } else {
            Write-Host "uv binary not found"
            exit 1
          }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.check-release.outputs.tag }}
          releaseName: "marimo Desktop App ${{ needs.check-release.outputs.marimo_version }}"
          releaseBody: |
            ## Tauri Desktop App Release ${{ needs.check-release.outputs.marimo_version }}

            This release contains the Tauri-based desktop application for marimo.

            ### Downloads

            #### Windows
            - **NSIS Installer**: `.exe`

            #### macOS
            - **DMG (Apple Silicon)**: `.dmg` (M1以降)
            - **DMG (Intel)**: `.dmg` (x86_64)

            #### Linux
            - **AppImage**: `.AppImage`
            - **Debian**: `.deb`

            ### Installation

            - **Windows**: Run the NSIS installer
            - **macOS**: Open the DMG file (Apple Silicon or Intel) and drag marimo to Applications
            - **Linux**: Make the AppImage executable (`chmod +x`) and run it, or install the .deb package

            ### Note
            On first launch, the app will automatically set up a Python environment using the bundled uv tool. This may take a minute on the first run.
          releaseDraft: false
          prerelease: false

  notify:
    name: Discord Notification
    needs: [check-release, build]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.check-release.outputs.marimo_version }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"username\": \"GitHub\", \"avatar_url\": \"https://cdn.discordapp.com/icons/1059888774789730424/bc13378b871c363137358a531e1a2f82.png\", \"embeds\": [{\"title\": \"marimo Desktop App ${RELEASE_VERSION}\", \"url\": \"https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}\", \"color\": 2105893, \"description\": \"New Tauri desktop release is available!\n\n**Downloads:**\n- Windows: NSIS installer (.exe)\n- macOS: DMG (Apple Silicon / Intel)\n- Linux: AppImage / .deb\"}]}" \
            "$DISCORD_WEBHOOK_URL"
