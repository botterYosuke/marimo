<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #667eea;
        }

        .status {
            font-size: 16px;
            margin-bottom: 15px;
            min-height: 24px;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .percent {
            font-size: 14px;
            color: #999;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #ffebee;
            border: 1px solid #ef5350;
            border-radius: 4px;
            font-size: 13px;
            color: #c62828;
            text-align: left;
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">backcast</div>
        <div class="status" id="status">初期化中...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div class="percent" id="percent">0%</div>
        <div class="error" id="error"></div>
    </div>
</body>

</html>
