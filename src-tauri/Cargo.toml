[package]
name = "marimo-desktop"
version = "0.1.0"
edition = "2021"
description = "marimo desktop application"

[features]
default = []
# Steam 版ビルド: <exe_dir>/data をデフォルトデータルートにするポータブルモードを有効化
# ビルド時: cargo tauri build --features steam
steam = []

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "webview-data-url"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
log = "0.4"
env_logger = "0.11"
simplelog = "0.12"
anyhow = "1"
url = "2"
urlencoding = "2"
thiserror = "2"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[package.metadata.bundle]
identifier = "com.marimo.desktop"

[package.metadata.tauri-winres]
